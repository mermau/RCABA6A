name: Build RCA BA-6A (Apple Silicon)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check build tools and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          command -v cmake
          command -v ninja || brew install ninja
          cmake --version
          xcodebuild -version

      - name: Create standalone icon
        shell: bash
        run: |
          set -euo pipefail
          swift assets/generate_app_icon.swift assets/app_icon.png
          test -s assets/app_icon.png

      - name: Configure (JUCE 8.0.16-security via FetchContent)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DRCABA6A_BUILD_PLUGIN=ON \
            -DBUILD_TESTING=ON

      - name: Build VST3, AU, Standalone and tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release \
            --target RCABA6A_VST3 RCABA6A_AU RCABA6A_Standalone BA6A_Tests BA6A_PluginTests \
            --parallel 3

      - name: Run tests (DSP vs RCA documentation, plugin integration, GUI snapshots)
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload GUI snapshots rendered by the tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcaba6a-gui-snapshots
          path: build/gui_snapshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Sign macOS bundles (ad hoc)
        shell: bash
        run: |
          set -euo pipefail
          base="build/RCABA6A_artefacts/Release"
          for bundle in "$base/VST3/rcaba6a.vst3" "$base/AU/rcaba6a.component" "$base/Standalone/rcaba6a.app"; do
            test -d "$bundle"
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
            executable=$(find "$bundle/Contents/MacOS" -maxdepth 1 -type f | head -n 1)
            test "$(lipo -archs "$executable")" = "arm64"
          done

      - name: Validate Audio Unit (auval)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R build/RCABA6A_artefacts/Release/AU/rcaba6a.component "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Rb6a Clfx

      - name: Validate VST3 (pluginval, strictness 10)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
            --timeout-ms 300000 build/RCABA6A_artefacts/Release/VST3/rcaba6a.vst3

      - name: Archive bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          base="build/RCABA6A_artefacts/Release"
          ditto -c -k --keepParent "$base/VST3/rcaba6a.vst3" dist/rcaba6a-vst3-macos-arm64.zip
          ditto -c -k --keepParent "$base/AU/rcaba6a.component" dist/rcaba6a-au-macos-arm64.zip
          ditto -c -k --keepParent "$base/Standalone/rcaba6a.app" dist/rcaba6a-standalone-macos-arm64.zip
          ls -lah dist

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcaba6a-vst3-macos-arm64
          path: dist/rcaba6a-vst3-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Audio Unit artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcaba6a-au-macos-arm64
          path: dist/rcaba6a-au-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcaba6a-standalone-macos-arm64
          path: dist/rcaba6a-standalone-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
